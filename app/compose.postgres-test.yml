services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_DB: workoutplan_test
      POSTGRES_USER: workoutplan_test
      POSTGRES_PASSWORD: ${WORKOUTPLAN_PG_TEST_PASSWORD:?Set the local test database password}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "workoutplan_test", "-d", "workoutplan_test"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-test-data:
